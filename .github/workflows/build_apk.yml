name: Build Android Watermark APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Get Dependencies
        run: flutter pub get

      # Fix old gal Android Gradle configuration
      - name: Patch gal Android build.gradle
        run: |
          GAL_FILE="$HOME/.pub-cache/hosted/pub.dev/gal-2.3.3/android/build.gradle"

          echo "Before patch:"
          cat "$GAL_FILE"

          sed -i 's/flutter.compileSdkVersion/35/g' "$GAL_FILE"

          echo "After patch:"
          cat "$GAL_FILE"

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Watermark-Studio-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
